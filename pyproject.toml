[project]
name = "subbota"
version = "0.1.0"
description = "Голосовой ассистент для Windows на Claude Opus 5.5 и Agent SDK"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.3",
    "claude-agent-sdk>=0.2.163",
    "comtypes>=1.4.17",
    "fastapi>=0.142.2",
    "faster-whisper>=1.2.1",
    "num2words>=0.5.14",
    "numpy>=2.5.3",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9,<10",
    "openwakeword>=0.4.0",
    "pillow>=12.3.0",
    "piper-tts>=1.8.0",
    "psutil>=7.2.2",
    "pycaw>=20260927",
    "pystray>=0.19.5",
    "pywin32>=312",
    "sounddevice>=0.5.6",
    "torch>=2.14.1",
    "uvicorn[standard]>=0.54.0",
    "vosk>=0.3.45",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: долгие тесты с моделями голоса (Silero, Vosk)"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
